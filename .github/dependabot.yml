# 의존성 업데이트 PR을 매주 자동으로 만든다. 각 PR은 CI를 통과해야 병합할 수 있다.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # 패치 · 마이너 업데이트는 PR 하나로 묶는다. 메이저 업데이트는 따로 받아 변경 사항을 검토한다.
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # 관리자 웹 (web/admin, pnpm)
  - package-ecosystem: npm
    directory: /web/admin
    schedule:
      interval: weekly
    # 새 버전이 나오고 1주일이 지난 뒤에 올린다. 공개 직후 문제가 드러나 철회되는 버전을 피한다 (공급망 안전).
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
