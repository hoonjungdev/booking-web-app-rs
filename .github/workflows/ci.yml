# 모든 검사는 scripts/check.sh를 그대로 호출한다 (로컬 · Claude Code 훅과 같은 명령).
# 컴파일러 버전은 rust-toolchain.toml을 따른다.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # 매주 월요일 09:00 KST: 코드가 그대로여도 새로 공개된 보안 권고(cargo-deny)를 잡기 위해
    - cron: "0 0 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # sqlx 매크로는 커밋된 .sqlx/로 검사한다 (컴파일에 DB 불필요)
  SQLX_OFFLINE: "true"
  # test · sqlx job의 PostgreSQL 서비스 컨테이너
  DATABASE_URL: postgres://booking:booking@localhost:5432/booking

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: scripts/check.sh fmt

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check.sh clippy

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # DB 테스트(#[sqlx::test])가 테스트마다 임시 데이터베이스를 만든다
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          POSTGRES_DB: booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booking -d booking"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      - run: scripts/check.sh test

  sqlx:
    name: sqlx (마이그레이션 · 오프라인 데이터)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          POSTGRES_DB: booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booking -d booking"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # sqlx CLI는 sqlx 크레이트와 같은 버전이어야 한다. rust-cache가 ~/.cargo/bin을 캐시하므로 두 번째부터는 설치를 건너뛴다.
      - name: sqlx CLI 설치
        run: |
          if ! sqlx --version 2>/dev/null | grep -q ' 0.9.0$'; then
            cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features postgres
          fi
      - run: scripts/check.sh sqlx

  deny:
    name: deny (보안 · 라이선스)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: scripts/check.sh deny

  shear:
    name: shear (미사용 의존성)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-shear@1.14.0
      - run: scripts/check.sh shear

  # 관리자 웹이 쓰는 API 문서(web/admin/openapi.json)가 서버 코드와 같은지 (DB 불필요: .sqlx로 컴파일)
  api:
    name: api (OpenAPI 문서)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check.sh api

  # 관리자 웹: API 타입이 openapi.json과 같은지, 타입 검사, ESLint, 빌드
  web:
    name: web (관리자 웹)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # pnpm 버전은 web/admin/package.json의 packageManager를 따른다
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/admin/package.json
          cache: true
          cache_dependency_path: web/admin/pnpm-lock.yaml
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: scripts/check.sh web

  # 브랜치 보호 규칙에는 이 job 하나만 "필수"로 걸면 된다.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [fmt, clippy, test, sqlx, deny, shear, api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 모든 검사 결과 확인
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "결과: $RESULTS"
          for r in $RESULTS; do
            [[ "$r" == "success" ]] || { echo "실패한 검사가 있습니다."; exit 1; }
          done
