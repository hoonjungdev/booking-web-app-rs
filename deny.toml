# cargo-deny 설정: 의존성의 보안 취약점, 라이선스, 중복 버전, 출처를 검사한다.
# 실행: scripts/check.sh deny   (또는 cargo deny check)
# 형식은 cargo-deny 0.20의 `cargo deny init` 결과를 기준으로 했다.

[graph]
all-features = true

[output]
feature-depth = 1

# RustSec 보안 권고 DB와 대조한다. 취약점(vulnerability)과 유지보수 중단(unmaintained) 경고가 기본으로 실패 처리된다.
[advisories]
ignore = [
    # 예외를 둘 때는 이유와 재검토 시점을 함께 적는다.
    # { id = "RUSTSEC-0000-0000", reason = "..." },
]

# 허용할 라이선스 목록. 새 의존성이 목록 밖 라이선스면 실패하고, 그때 검토 후 추가한다.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []
# 허용 목록의 라이선스가 아직 쓰이지 않아도 경고하지 않는다 (의존성이 늘어나며 채워진다).
unused-allowed-license = "allow"

# 우리 워크스페이스 크레이트는 배포하지 않으므로(publish = false) 라이선스 검사에서 뺀다.
[licenses.private]
ignore = true

[bans]
# 같은 크레이트의 여러 버전은 흔하므로 경고만 한다 (빌드 시간 증가의 신호로 본다).
multiple-versions = "warn"
# 버전을 `*`로 지정한 의존성 금지. 워크스페이스 내부 path 의존성은 예외.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = []
skip = []
skip-tree = []

# crates.io 외의 레지스트리나 git 의존성은 금지한다. 필요하면 명시적으로 허용 목록에 추가한다.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
