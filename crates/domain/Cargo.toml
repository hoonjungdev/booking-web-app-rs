[package]
name = "domain"
description = "예약 도메인 모델, 상태 머신, 도메인 에러 (I/O 없음)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# API 문서(OpenAPI)에 쓸 스키마를 derive한다 (`utoipa::ToSchema`). 문서를 만드는 booking-server만 켠다.
# 켜지 않으면 utoipa를 아예 컴파일하지 않는다. → docs/decisions.md D-25
openapi = ["dep:utoipa"]

[dependencies]
chrono.workspace = true
serde.workspace = true
thiserror.workspace = true
utoipa = { workspace = true, optional = true }
uuid.workspace = true

[dev-dependencies]
serde_json.workspace = true
