[workspace]
resolver = "3"
members = ["crates/*"]

# 모든 크레이트가 공유하는 패키지 정보. 각 크레이트에서 `xxx.workspace = true`로 가져다 쓴다.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

# 여러 크레이트가 함께 쓰는 의존성의 버전을 한곳에서 관리한다 (≈ .NET의 Directory.Packages.props).
# 각 크레이트에서는 `tokio.workspace = true`처럼 가져다 쓰고, 필요한 feature만 덧붙인다.
[workspace.dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.29.2", features = ["v7", "serde"] }

# 모든 크레이트에 같은 린트 규칙을 적용한다 (각 크레이트의 `[lints] workspace = true`).
# CI와 Stop 훅은 `-D warnings`로 돌리므로 "warn"도 사실상 빌드 실패다.
[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
# 기본 그룹(correctness, suspicious, style, complexity, perf)은 그대로 켜 둔다.
# 아래는 CLAUDE.md 코딩 규칙을 기계적으로 강제하기 위해 추가로 켜는 것들이다.
unwrap_used = "warn"          # 테스트 밖 unwrap 금지 (expect("이유")는 허용)
dbg_macro = "warn"            # dbg!() 남기지 않기
todo = "warn"                 # todo!() 남기지 않기
unimplemented = "warn"
print_stdout = "warn"         # println! 대신 tracing
print_stderr = "warn"
large_futures = "warn"        # 너무 큰 Future (스택 오버플로 위험)
needless_pass_by_value = "warn"
