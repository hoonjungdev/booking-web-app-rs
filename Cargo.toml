[workspace]
resolver = "3"
members = ["crates/*"]

# 모든 크레이트가 공유하는 패키지 정보. 각 크레이트에서 `xxx.workspace = true`로 가져다 쓴다.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

# 여러 크레이트가 함께 쓰는 의존성의 버전을 한곳에서 관리한다 (≈ .NET의 Directory.Packages.props).
# 각 크레이트에서는 `tokio.workspace = true`처럼 가져다 쓰고, 필요한 feature만 덧붙인다.
[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.6.7", features = ["derive"] }
# tokio-console 개발 모드에서만 쓴다 (telemetry의 `tokio-console` feature, docs/05-observability-and-analytics.md §9)
console-subscriber = "0.5.0"
dotenvy = "0.15.7"
figment = { version = "0.10.19", features = ["env"] }
# 업체 호출 rate limit (GCRA 토큰 버킷). 기본 기능의 dashmap(키별 limiter) · quanta(고속 시계) · jitter는 쓰지 않는다.
governor = { version = "0.10.4", default-features = false, features = ["std"] }
# OpenTelemetry: 추적 · 메트릭 · 로그를 OTLP로 내보낸다 (docs/05-observability-and-analytics.md).
# - `opentelemetry`는 계측 API다. 라이브러리 크레이트(providers)는 이것만 쓴다 (≈ .NET의 System.Diagnostics.Metrics / ActivitySource).
# - `opentelemetry_sdk` · `opentelemetry-otlp`는 실제 수집 · 전송 구현이다. telemetry 크레이트만 쓴다 (docs/decisions.md D-20).
# opentelemetry 계열은 버전을 함께 올린다. tracing-opentelemetry는 대응하는 버전이 따로 있다 (0.34 ↔ opentelemetry 0.33).
opentelemetry = "0.33.1"
# tracing 이벤트 → OpenTelemetry 로그
opentelemetry-appender-tracing = "0.33.1"
# HTTP 헤더 ↔ trace 정보(`traceparent`) 변환 도우미
opentelemetry-http = "0.33.1"
# 기본 기능: HTTP + protobuf 전송, 전용 스레드에서 도는 reqwest blocking 클라이언트 (gRPC · tonic 없이 가볍다)
opentelemetry-otlp = "0.33.1"
opentelemetry_sdk = "0.33.1"
rand = "0.10.3"
# TLS 없이 http만 쓴다. 실제 업체(https)와 연동할 때 TLS feature를 추가한다.
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# sqlx CLI(`sqlx`, `cargo sqlx`)도 같은 0.9.0을 쓴다. 오프라인 쿼리 데이터(.sqlx/) 형식이 버전에 묶여 있다.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "chrono", "json"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tokio-util = "0.7.20"
tower = "0.5.3"
tracing = "0.1.44"
# tracing span → OpenTelemetry span. 기본 기능 중 MetricsLayer(이벤트로 메트릭 만들기)는 쓰지 않는다.
tracing-opentelemetry = { version = "0.34.0", default-features = false, features = ["tracing-log"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.29.2", features = ["v7", "serde"] }

# 워크스페이스 내부 크레이트
db = { path = "crates/db" }
domain = { path = "crates/domain" }
mock-provider = { path = "crates/mock-provider" }
providers = { path = "crates/providers" }
telemetry = { path = "crates/telemetry" }

# 모든 크레이트에 같은 린트 규칙을 적용한다 (각 크레이트의 `[lints] workspace = true`).
# CI와 Stop 훅은 `-D warnings`로 돌리므로 "warn"도 사실상 빌드 실패다.
[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
# 기본 그룹(correctness, suspicious, style, complexity, perf)은 그대로 켜 둔다.
# 아래는 CLAUDE.md 코딩 규칙을 기계적으로 강제하기 위해 추가로 켜는 것들이다.
unwrap_used = "warn"          # 테스트 밖 unwrap 금지 (expect("이유")는 허용)
dbg_macro = "warn"            # dbg!() 남기지 않기
todo = "warn"                 # todo!() 남기지 않기
unimplemented = "warn"
print_stdout = "warn"         # println! 대신 tracing
print_stderr = "warn"
large_futures = "warn"        # 너무 큰 Future (스택 오버플로 위험)
needless_pass_by_value = "warn"
